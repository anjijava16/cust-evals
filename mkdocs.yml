  - Contributing:
      - Contributing Guide: contributing.md

# Plugins
plugins:
  - search
  - autorefs

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anjijava16/cust-evals
  version:
    provider: mike
