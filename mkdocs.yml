# MkDocs Configuration for Custom Evals Documentation

site_name: Custom Evals Documentation
site_description: Lightweight evaluation framework for LLM outputs
site_author: Custom Evals Team
site_url: https://anjijava16.github.io/cust-evals/

# Repository
repo_name: anjijava16/cust-evals
repo_url: https://github.com/anjijava16/cust-evals
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 Custom Evals

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home:
      - Overview: index.md
      - Getting Started: getting-started.md
      - Examples: examples.md

  - Guides:
      - Quick Start: guides/QUICKSTART.md
      - Agents & RAG Quick Start: guides/AGENTS_RAG_QUICKSTART.md
      - LLM Integration: guides/LLM_GUIDE.md
      - Ground Truth: guides/GROUND_TRUTH_GUIDE.md
      - Tracing: guides/TRACING_GUIDE.md
      - Practical Examples: guides/PRACTICAL_EXAMPLES_GUIDE.md

  - Reference:
      - Architecture: reference/ARCHITECTURE.md
      - Framework Comparison: reference/FRAMEWORK_COMPARISON.md
      - Framework Support: reference/FRAMEWORK_SUPPORT.md
      - Project Overview: reference/PROJECT_OVERVIEW.md
      - Documentation Index: reference/INDEX.md

  - Evaluators:
      - Code-Based Metrics: evaluators/code-based.md
      - LLM-Based Evaluators: evaluators/llm-based.md
      - RAG-Specific Evaluators: evaluators/rag-specific.md

  - Integration Guides:
      - Agents & Multi-Agent: agents-integration.md
      - RAG Applications: rag-integration.md
      - LLM Applications: llm-app-integration.md

  - Agent Frameworks:
      - Framework Index: FRAMEWORK_INDEX.md
      - Agno: frameworks/agno.md
      - AWS Strands Agents: frameworks/aws-strands.md
      - Google ADK: frameworks/google-adk.md
      - LlamaIndex Workflows: frameworks/llamaindex-workflows.md
      - Microsoft Agent Framework: frameworks/microsoft-agent-framework.md
      - Databricks Agent Bricks: frameworks/databricks-agent-bricks.md
      - Semantic Kernel: frameworks/semantic-kernel.md
      - LangGraph: frameworks/langgraph.md
      - CrewAI: frameworks/crewai.md
      - Pydantic AI: frameworks/pydanticai.md
      - OpenAI Agents SDK: frameworks/openai-agents.md
      - OpenAI Agents Framework: frameworks/openai-agents-framework.md
      - OpenAI Assistants: frameworks/openai-assistants.md
      - OpenAI Swarm: frameworks/openai-swarm.md
      - Autogen: frameworks/autogen.md
      - LangChain RAG: frameworks/langchain-rag.md
      - LlamaIndex RAG: frameworks/llamaindex-rag.md

  - Guides:
      - API Reference: api-reference.md
      - LLM Integration: llm-integration.md
      - Phoenix Tracing (Optional): tracing.md
      - Ground Truth Handling: ground-truth.md
      - Architecture: architecture.md
      - Framework Comparison: framework-comparison.md

  - Testing:
