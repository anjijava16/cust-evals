# MkDocs Configuration for Custom Evals Documentation

site_name: Custom Evals Documentation
site_description: Lightweight evaluation framework for LLM outputs
site_author: Custom Evals Team
site_url: https://anjijava16.github.io/cust-evals/

# Repository
repo_name: anjijava16/cust-evals
repo_url: https://github.com/anjijava16/cust-evals
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 Custom Evals

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home:
      - Overview: index.md
      - Getting Started: getting-started.md
      - Examples: examples.md

  - Evaluators:
      - Code-Based Metrics: evaluators/code-based.md
      - LLM-Based Evaluators: evaluators/llm-based.md
      - RAG-Specific Evaluators: evaluators/rag-specific.md

  - Integration Guides:
      - Agents & Multi-Agent: agents-integration.md
      - RAG Applications: rag-integration.md
      - LLM Applications: llm-app-integration.md

  - Guides:
      - API Reference: api-reference.md
      - LLM Integration: llm-integration.md
      - Phoenix Tracing (Optional): tracing.md
      - Ground Truth Handling: ground-truth.md
      - Architecture: architecture.md
      - Framework Comparison: framework-comparison.md

  - Testing:
      - Testing Guide: testing.md

  - Contributing:
      - Contributing Guide: contributing.md

# Plugins
plugins:
  - search
  - autorefs

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anjijava16/cust-evals
  version:
    provider: mike
