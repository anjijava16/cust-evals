[pytest]
# Pytest configuration for Custom Evals

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    llm: Tests that require LLM API calls
    tracing: Tests for tracing functionality

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src/custom/evals --cov-report=html --cov-report=term

# Asyncio mode
asyncio_mode = auto
